name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This connector aims to stay small and safe. It can only expose what the Vero Agent Access API already offers, and it will not add anything that moves money.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. The solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the connector to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
